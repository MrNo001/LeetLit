  input.addEventListener("keydown", ev => {
    if (ev.key === "ArrowDown" && hits.length) { sel = (sel + 1) % hits.length; paint(); ev.preventDefault(); }
    else if (ev.key === "ArrowUp" && hits.length) { sel = (sel - 1 + hits.length) % hits.length; paint(); ev.preventDefault(); }
    else if (ev.key === "Enter" && sel >= 0) { const id = hits[sel]; close(); input.value = ""; onPick(id); ev.preventDefault(); }
    else if (ev.key === "Escape") { close(); }
  });
  input.addEventListener("focus", () => { if (input.value.trim()) paint(); });
  list.addEventListener("mousedown", ev => ev.preventDefault());
  list.addEventListener("click", ev => {
    const li = ev.target.closest("[data-pick]");
    if (!li) return;
    close(); input.value = ""; onPick(li.dataset.pick);
  });
  input.addEventListener("blur", () => setTimeout(close, 120));
}

/* ---------- selection & history ---------- */
const trail = [];
function renderTrail() {
  document.getElementById("trail").innerHTML = trail.map((id, i) =>
    `${i ? `<span aria-hidden="true">›</span>` : ""}<button type="button" data-id="${id}"${id === current ? ' aria-current="true"' : ""}>${esc(E[id].name)}</button>`).join("");
}
document.getElementById("trail").addEventListener("click", ev => { const b = ev.target.closest("[data-id]"); if (b) select(b.dataset.id); });

function select(id, opts = {}) {
  if (!E[id]) return;
  current = id;
  const at = trail.indexOf(id);
  if (at >= 0) trail.splice(at, 1);
  trail.push(id);
  if (trail.length > 7) trail.shift();
  renderTree(id, opts);
  renderPanel(id);
  renderTrail();
  document.title = `${E[id].name} · Theogony Family Tree`;
  if (location.hash.slice(1) !== id) { try { history.replaceState(null, "", "#" + id); } catch (_) {} }
  try { localStorage.setItem("theogony-last", id); } catch (_) {}
  if (opts.scrollPanel && matchMedia("(max-width: 900px)").matches) document.querySelector(".stage").scrollIntoView({ block: "start" });
}
window.addEventListener("hashchange", () => { const id = decodeURIComponent(location.hash.slice(1)); if (E[id] && id !== current) select(id); });

/* ---------- chrome ---------- */
document.getElementById("count").textContent = D.entities.filter(e => !e.isGroup).length;
document.getElementById("legend").innerHTML = KINDS.map(([k, l]) => `<span class="k-${k}"><i></i><span>${KIND_SHORT[k] ? `${KIND_SHORT[k][0]}<span class="long">${KIND_SHORT[k][1]}</span>` : l}</span></span>`).join("") + `<span class="hint">Drag to pan · scroll to zoom</span>`;
const quick = document.querySelector(".quick");
for (const id of ["chaos", "gaia", "nyx", "ouranos", "cronos", "zeus", "aphrodite", "prometheus", "styx", "medusa", "heracles", "muses"]) {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = E[id].name; b.dataset.id = id;
  b.onclick = () => select(id, { scrollPanel: true });
  quick.appendChild(b);
}
attachSearch(document.getElementById("q"), document.getElementById("q-results"), id => select(id, { scrollPanel: true }));
document.addEventListener("keydown", ev => {
  if (ev.key === "/" && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) { ev.preventDefault(); document.getElementById("q").focus(); }
});

/* index overlay */
const overlay = document.getElementById("overlay"), idxBody = document.getElementById("idx-body"), idxFilter = document.getElementById("idx-filter");
let lastFocus = null;
function paintIndex() {
  const f = norm(idxFilter.value);
  idxBody.innerHTML = KINDS.map(([k, l]) => {
    const list = D.entities.filter(e => e.kind === k && (!f || norm(e.name).includes(f) || (e.aka || []).some(a => norm(a).includes(f)) || norm(e.en).includes(f)))
      .sort((a, b) => a.name.localeCompare(b.name));
    if (!list.length) return "";
    return `<section class="idx k-${k}"><h3><i></i>${l} <small>${list.length}</small></h3><ul>${list.map(e =>
      `<li><button type="button" data-id="${e.id}">${esc(e.name)}</button>${qualifier(e) || e.isGroup ? `<small>${esc(e.isGroup ? "group" : qualifier(e))}</small>` : e.en && e.en !== e.name && e.en.length < 18 ? `<small>${esc(e.en)}</small>` : ""}</li>`).join("")}</ul></section>`;
  }).join("") || `<p>No names match.</p>`;
}
function openIndex() { lastFocus = document.activeElement; overlay.hidden = false; paintIndex(); idxFilter.value = ""; idxFilter.focus(); }
function closeIndex() { overlay.hidden = true; if (lastFocus) lastFocus.focus(); }
document.getElementById("browse").onclick = openIndex;
document.getElementById("idx-close").onclick = closeIndex;
idxFilter.addEventListener("input", paintIndex);
overlay.addEventListener("click", ev => {
  if (ev.target === overlay) { closeIndex(); return; }
  const b = ev.target.closest("[data-id]");
  if (b) { closeIndex(); select(b.dataset.id, { scrollPanel: true }); }
});
overlay.addEventListener("keydown", ev => {
  if (ev.key === "Escape") closeIndex();
  if (ev.key === "Tab") {
    const f = [...overlay.querySelectorAll("button, input")].filter(x => !x.disabled);
    if (!f.length) return;
    if (ev.shiftKey && document.activeElement === f[0]) { f[f.length - 1].focus(); ev.preventDefault(); }
    else if (!ev.shiftKey && document.activeElement === f[f.length - 1]) { f[0].focus(); ev.preventDefault(); }
  }
});

/* boot */
let first = decodeURIComponent(location.hash.slice(1));
if (!E[first]) { try { first = localStorage.getItem("theogony-last"); } catch (_) { first = null; } }
select(E[first] ? first : "zeus", { instant: true });
})();
</script>
</body>
</html>
